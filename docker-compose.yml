services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      TRUSTED_PROXY_HOSTS: "${TRUSTED_PROXY_HOSTS:-*}"
      GENERATION_CREATE_RATE_LIMIT_WINDOW_SECONDS: "${GENERATION_CREATE_RATE_LIMIT_WINDOW_SECONDS:-300}"
      GENERATION_CREATE_RATE_LIMIT_MAX_REQUESTS: "${GENERATION_CREATE_RATE_LIMIT_MAX_REQUESTS:-3}"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:18000:8000"
    volumes:
      - ./backend:/app
      - ./tools:/tools:ro
      - ./runtime:/runtime
      - ./runtime:/app/runtime
      - ./ref:/ref:ro
      - ./ref:/app/ref:ro
      - ${CODEX_CONFIG_DIR:-./runtime/codex-home}:/root/.codex
      - ${CLAUDE_CODE_CONFIG_DIR:-./runtime/claude-home}:/root/.claude

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:15173:80"
    depends_on:
      - api
