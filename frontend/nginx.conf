server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* \.map$ {
        return 404;
    }

    # ^~ keeps the regex locations below from swallowing /api/generated/*.webp.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Exact match: a bare "/api" would otherwise fall through to the SPA
    # location and return index.html instead of reaching the backend.
    location = /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Removed backend namespaces: never fall back to the SPA shell.
    location ^~ /static/ {
        return 404;
    }

    location ^~ /generated/ {
        return 404;
    }

    # A missing file with an extension is a 404, not index.html. Real assets
    # (js/css/webp/ico/...) are still served by try_files from the root.
    location ~* \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Extensionless paths are React Router routes, so they still get the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
